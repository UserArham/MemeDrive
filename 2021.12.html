
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

    <title>MemeDrive (Among Us 2021.12.15)</title>


    <!-- OpenProcessing -->
    <!-- keep the line below for OpenProcessing compatibility -->
    <script src="https://openprocessing.org/openprocessing_sketch.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>

    <script src="mySketch.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">


    <!-- White loading screen -->

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }


        #launch_screen {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: white;

            display: flex;

            align-items: center;
            justify-content: center;

            user-select: none;

            font-family: Arial, Helvetica, sans-serif;

            z-index: 999999;

        }


        .launch_box {

            text-align: center;

            transform: translateY(-40px);

        }


        .launch_box h1 {

            margin-bottom: 25px;

        }


        .launch_text {

            font-weight: bold;

        }


        #progress {

            border: 2px solid black;

            width: 300px;

            height: 15px;

            padding: 1px;

            margin: 20px auto;

        }


        #progress_bar {

            background: #b00000;

            width: 0%;

            height: 100%;

        }


        button {

            cursor: pointer;

        }

    </style>

</head>


<body>


    <!-- Loading screen -->

    <div id="launch_screen">

        <div class="launch_box">

            <h1>
                This file is made in 8/18/2025
            </h1>


            <h2 class="launch_text">

                Game will launch in

                <span id="countdown">5</span>...

            </h2>


            <div id="progress">

                <div id="progress_bar"></div>

            </div>


            <p>

                <button id="skip">
                    Skip Countdown
                </button>

            </p>

        </div>

    </div>


    <!-- Prevent browser scrolling from game controls -->

    <script>

        window.addEventListener("keydown", function(e) {

            if (
                [
                    "Space",
                    "ArrowUp",
                    "ArrowDown",
                    "ArrowLeft",
                    "ArrowRight"
                ].indexOf(e.code) > -1
            ) {

                e.preventDefault();

            }

        }, false);

    </script>


    <noscript>

        <div id="notSupportedWrap">

            <h2 id="notSupportedTitle">
                This content requires JavaScript
            </h2>

            <p class="notSupportedMessage">
                JavaScript appears to be disabled.
                Please enable it to view this content. Thanks! :)
            </p>

        </div>

    </noscript>


    <!-- Among Us -->

    <script src="https://cdn.jsdelivr.net/gh/mamayaya1/game@f3a882424a8f28d07bdf456b251d889725c4c1e4/projects/among-us/scripts/supportcheck.js"></script>

    <script
        src="https://cdn.jsdelivr.net/gh/mamayaya1/game@f3a882424a8f28d07bdf456b251d889725c4c1e4/projects/among-us/scripts/offlineclient.js"
        type="module">
    </script>

    <script
        src="https://cdn.jsdelivr.net/gh/gahaden/ags@4f1a2b8755bcbf67ba043a7eca6c2e05d0b5bfe5/main.js"
        type="module">
    </script>

    <script
        src="https://cdn.jsdelivr.net/gh/mamayaya1/game@f3a882424a8f28d07bdf456b251d889725c4c1e4/projects/among-us/scripts/register-sw.js"
        type="module">
    </script>


    <!-- Loading countdown -->

    <script>

        "use strict";

        window.addEventListener("load", function() {

            var launchCounter = 1;

            var launchSkipCountdown = false;

            var countdown =
                document.getElementById("countdown");

            var progress =
                document.getElementById("progress_bar");


            var timer = setInterval(function() {

                countdown.innerText =
                    Math.floor(6 - launchCounter * 0.06);

                progress.style.width =
                    launchCounter + "%";

                launchCounter++;


                if (
                    launchCounter > 100 ||
                    launchSkipCountdown
                ) {

                    clearInterval(timer);

                    document
                        .getElementById("launch_screen")
                        .remove();

                }

            }, 50);


            document.getElementById("skip").onclick =
                function() {

                    launchSkipCountdown = true;

                };

        });

    </script>


</body>

</html>
